<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>에세이 아침 카드 뷰어</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f8fafc; word-break: keep-all; -webkit-tap-highlight-color: transparent; }
    /* Tailwind Play CDN이 자체 <style>을 뒤늦게 주입하면서 동일 우선순위의 p-4 같은
       유틸리티 클래스가 아래 padding-bottom을 덮어써 하단 내비게이션 바에 본문 마지막
       줄이 가려지는 문제가 있었음. main 태그 결합 선택자 + !important로 항상 이기게 고정. */
    main.content-area { padding-bottom: calc(7rem + env(safe-area-inset-bottom)) !important; }
    footer.bottom-nav { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)) !important; }
  </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen justify-between">

  <!-- 원터치 주소 복사 상단 바 -->
  <div class="bg-slate-900 text-white text-xs px-4 py-2.5 flex items-center justify-between sticky top-0 z-30">
    <span class="truncate pr-2">💡 외부 브라우저(Chrome/Safari) 이용 권장</span>
    <button onclick="copyURL()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-2.5 py-1 rounded text-xs shrink-0 active:scale-95 transition">
      주소 복사
    </button>
  </div>

  <!-- 상단 헤더 & 테마 -->
  <header class="bg-white/90 backdrop-blur border-b border-slate-200 px-4 py-3 shadow-sm sticky top-[37px] z-20">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <span id="theme-badge" class="inline-block bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full mb-0.5">테마 로딩 중</span>
        <h1 class="text-lg font-bold text-slate-900" id="theme-desc">오늘의 에세이</h1>
      </div>
      <input type="date" id="date-picker" class="text-xs border border-slate-300 rounded px-1.5 py-1 text-slate-600 bg-slate-50">
    </div>
  </header>

  <!-- 메인 카드 영역 -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 content-area">
    <div id="card-container" class="bg-white rounded-2xl p-6 shadow-md border border-slate-100">
      <div class="flex items-center justify-between mb-3">
        <span id="article-press" class="text-xs font-bold px-2.5 py-1 rounded-md bg-slate-100 text-slate-700">언론사</span>
        <span id="article-group" class="text-xs font-medium text-slate-400">구분</span>
      </div>
      <h2 id="article-title" class="text-xl font-bold text-slate-900 leading-snug mb-4">칼럼 제목</h2>
      <hr class="border-slate-100 my-4">
      <div id="article-content" class="text-slate-700 text-base leading-relaxed whitespace-pre-line min-h-[250px]">
        본문 내용을 불러오는 중입니다...
      </div>
    </div>
  </main>

  <!-- 하단 내비게이션 바 -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-slate-200 bottom-nav z-20">
    <div class="max-w-md mx-auto px-6 py-2.5 flex items-center justify-between">
      <button id="prev-btn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm active:scale-95 transition">
        ◀ 이전
      </button>
      <span id="page-indicator" class="text-sm font-semibold text-slate-500">1 / 1</span>
      <button id="next-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm active:scale-95 transition shadow-sm">
        다음 ▶
      </button>
    </div>
  </footer>

  <script>
    let articles = [];
    let currentIndex = 0;

    function copyURL() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("주소가 복사되었습니다! Chrome이나 Safari 앱을 열고 주소창에 붙여넣어 주세요.");
      });
    }

    async function loadArticles(dateStr = null) {
      const url = dateStr ? `opinions/${dateStr}.json` : 'data.json';
      try {
        const res = await fetch(url + '?t=' + new Date().getTime());
        if (!res.ok) throw new Error("데이터 없음");
        const data = await res.json();
        
        document.getElementById('theme-badge').innerText = data.theme || '오늘의 테마';
        document.getElementById('theme-desc').innerText = data.theme_desc || '에세이 아침 카드';
        document.getElementById('date-picker').value = data.date || new Date().toISOString().split('T')[0];

        articles = data.articles || [];
        currentIndex = 0;
        renderCard();
      } catch (err) {
        document.getElementById('article-title').innerText = "데이터를 불러올 수 없습니다";
        document.getElementById('article-content').innerText = "선택하신 날짜의 데이터가 존재하지 않거나 수집된 기사가 없습니다.";
      }
    }

    function renderCard() {
      if (articles.length === 0) return;
      const item = articles[currentIndex];
      
      document.getElementById('article-press').innerText = item.press;
      document.getElementById('article-group').innerText = item.group || '';
      document.getElementById('article-title').innerText = item.title;
      document.getElementById('article-content').innerText = item.content;
      document.getElementById('page-indicator').innerText = `${currentIndex + 1} / ${articles.length}`;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIndex < articles.length - 1) {
        currentIndex++;
        renderCard();
      }
    });

    document.getElementById('date-picker').addEventListener('change', (e) => {
      loadArticles(e.target.value);
    });

    loadArticles();

    // PWA 서비스 워커 등록 (오프라인 캐싱 + 홈 화면 설치 지원)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('서비스 워커 등록 실패:', err);
        });
      });
    }
  </script>
</body>
</html>
