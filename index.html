<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오피니언 칼럼 카드 뷰어</title>
  <style>
    :root { --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --accent: #3b82f6; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Nanum Myeongjo', serif, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 16px; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.1); }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: var(--accent); color: white; }
    .card-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
    .card { background: var(--card-bg); max-width: 600px; width: 100%; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: opacity 0.3s; }
    .card.read { opacity: 0.5; }
    .title { font-size: 1.4rem; font-weight: bold; margin-bottom: 12px; line-height: 1.4; }
    .content { font-size: 1.05rem; line-height: 1.8; white-space: pre-wrap; word-break: break-all; margin-top: 16px; }
    footer { padding: 16px; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(0,0,0,0.1); }
    button { padding: 10px 16px; border: none; border-radius: 8px; background: var(--accent); color: white; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div>
      <span id="pressBadge" class="badge">언론사</span>
      <span id="categoryTag" style="font-size: 12px; margin-left: 8px;">사설</span>
    </div>
    <div>
      <input type="date" id="datePicker" onchange="loadDate(this.value)">
      <button onclick="toggleRead()" style="background:transparent; color:var(--text); border:1px solid #ccc; margin-left:8px;">✓ 읽음</button>
    </div>
  </header>

  <div class="card-container" id="swipeArea">
    <div class="card" id="card">
      <div class="title" id="title">칼럼을 불러오는 중...</div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <footer>
    <button onclick="prevCard()">이전</button>
    <span id="pageInfo">0 / 0</span>
    <button onclick="nextCard()">다음</button>
  </footer>

  <script>
    let articles = [];
    let currentIndex = 0;
    let readSet = new Set(JSON.parse(localStorage.getItem('readCards') || '[]'));

    async function loadData(url = 'data.json') {
      try {
        const res = await fetch(url);
        const data = await res.json();
        articles = data.articles || [];
        document.getElementById('datePicker').value = data.date || new Date().toISOString().split('T')[0];
        currentIndex = 0;
        render();
      } catch(e) {
        document.getElementById('title').innerText = "데이터를 불러올 수 없습니다.";
      }
    }

    function loadDate(dateStr) {
      loadData(`opinions/${dateStr}.json`);
    }

    function render() {
      if(!articles.length) return;
      const item = articles[currentIndex];
      document.getElementById('pressBadge').innerText = item.press;
      document.getElementById('categoryTag').innerText = item.category;
      document.getElementById('title').innerText = item.title;
      document.getElementById('content').innerText = item.content;
      document.getElementById('pageInfo').innerText = `${currentIndex + 1} / ${articles.length}`;
      
      const cardEl = document.getElementById('card');
      if(readSet.has(item.id)) cardEl.classList.add('read');
      else cardEl.classList.remove('read');
    }

    function toggleRead() {
      if(!articles.length) return;
      const id = articles[currentIndex].id;
      if(readSet.has(id)) readSet.delete(id);
      else readSet.add(id);
      localStorage.setItem('readCards', JSON.stringify([...readSet]));
      render();
    }

    function nextCard() { if(currentIndex < articles.length - 1) { currentIndex++; render(); } }
    function prevCard() { if(currentIndex > 0) { currentIndex--; render(); } }

    // Touch Swipe Event
    let startX = 0;
    document.getElementById('swipeArea').addEventListener('touchstart', e => startX = e.touches[0].clientX);
    document.getElementById('swipeArea').addEventListener('touchend', e => {
      let diff = startX - e.changedTouches[0].clientX;
      if(diff > 50) nextCard();
      else if(diff < -50) prevCard();
    });

    loadData();
  </script>
</body>
</html>
