name: Daily Opinion Collector

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write # Git Push 권한 부여

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pywebpush의 의존 패키지(http-ece)가 최신 setuptools에서 빌드 실패하는 이슈 방지
          pip install "setuptools<66" wheel
          pip install -r requirements.txt

      - name: Run collector script
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PWA_URL: ${{ secrets.PWA_URL }}
        run: python collector.py

      - name: Commit and push updated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data.json history.json opinions/
          git diff-index --quiet HEAD || git commit -m "Auto-update daily data [skip ci]"
          git push
