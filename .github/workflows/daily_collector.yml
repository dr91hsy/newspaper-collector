name: Daily Opinion Collector

on:
  schedule:
    # 매일 KST 아침 7시 실행 (UTC 기준 전날 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 웹상에서 버튼을 눌러 수동 실행 가능하도록 허용

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector script
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          TO_MAIL: ${{ secrets.TO_MAIL }}
        run: python collector.py

      - name: Commit and push updated opinions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add opinions/
          git diff-index --quiet HEAD || git commit -m "Auto-update daily opinions [skip ci]"
          git push
